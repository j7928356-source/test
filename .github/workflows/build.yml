name: Build CIA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y unzip wget git cmake g++ make python3

      - name: Install 3DS libraries (libctru, smdhtool, 3dsxtool)
        run: dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Install makerom
        run: |
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O makerom.zip
          mkdir -p mr && unzip -o makerom.zip -d mr
          cp "$(find mr -type f -name 'makerom*' ! -name '*.zip' | head -n 1)" /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          makerom -version || true

      - name: Install bannertool (build from source)
        run: |
          git clone --recursive https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          mkdir build && cd build
          cmake .. && make -j"$(nproc)"
          cp "$(find . -type f -name bannertool | head -n 1)" /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool

      - name: Unpack project zip
        run: |
          ZIP="$(find . -maxdepth 2 -name 'atari2600_3ds_project.zip' -not -path './.git/*' | head -n 1)"
          mkdir -p build_dir
          if [ -n "$ZIP" ]; then
            echo "Found $ZIP"
            unzip -o "$ZIP" -d build_dir
          else
            echo "Zip not found, using repo files directly"
            cp -r ./* build_dir/ 2>/dev/null || true
          fi
          find build_dir -maxdepth 3 -not -path '*/.git/*'

      - name: Build CIA
        run: |
          MK="$(find build_dir -name Makefile | head -n 1)"
          [ -n "$MK" ] || { echo "ERROR: no Makefile found"; exit 1; }
          cd "$(dirname "$MK")"
          echo "DEVKITARM=$DEVKITARM"
          # regenerate placeholder assets if missing
          [ -f assets/icon.png ] || python3 tools/make_assets.py
          make cia

      - name: Collect output
        run: |
          mkdir -p out
          find build_dir \( -name '*.cia' -o -name '*.3dsx' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Atari2600-CIA
          path: out/*
          if-no-files-found: error
