name: Build 3DS CIA
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Build CIA
        run: |
          apt-get update && apt-get install -y unzip python3-pil
          ZIPFILE=$(ls -t *.zip | head -n 1)
          unzip -o "$ZIPFILE" -d build_dir
          cd build_dir/* 2>/dev/null || cd build_dir
          make
          make cia || true
          if ! ls *.cia 1> /dev/null 2>&1; then
            python3 -c '
from PIL import Image
Image.new("RGB", (48, 48), (30, 30, 80)).save("icon.png")
Image.new("RGB", (256, 128), (30, 30, 80)).save("banner.png")
'
            bannertool makesmdh -s "Atari 2600 3DS" -l "Atari 2600 Emulator" -p "j7928356" -i icon.png -o icon.icn
            bannertool makebanner -i banner.png -a /opt/devkitpro/examples/3ds/audio/streaming/data/sample.wav -o banner.bnr 2>/dev/null || bannertool makebanner -i banner.png -o banner.bnr || true
            ELF=$(ls *.elf | head -n 1)
            RSF=$(ls *.rsf | head -n 1)
            if [ -z "$RSF" ]; then
              cat << 'EOF' > cia.rsf
BasicInfo:
  Title                   : Atari 2600 3DS
  CompanyCode             : "00"
  ProductCode             : CTR-P-A26X
  ContentType             : Application
  Logo                    : Nintendo
TitleInfo:
  Category                : Application
  UniqueId                : 0xFA260
Option:
  UseOnSD                 : true
  FreeProductCode         : true
  MediaFootPrint          : SDCard
  EnableCrypt             : false
  EnableCompress          : true
AccessControlInfo:
  CoreVersion             : 2
  AppMemory               : 64MB
  SystemMode              : 64MB
  IdealProcessor          : 0
  AffinityMask            : 1
  Priority                : 16
  MaxCpu                  : 0x9E
  HandleTableSize         : 0x200
  FileSystemAccess:
    - DirectSdmc
  IoAccessControl:
    - FsMountSdmc
  ServiceAccessControl:
    - apt:A
    - cfg:u
    - dsp::DSP
    - fs:USER
    - gsp::Gpu
    - hid:USER
    - ptm:u
  SystemCallAccess:
    ArbitrateAddress: 34
    Break: 60
    CancelTimer: 28
    ClearEvent: 25
    ClearTimer: 29
    CloseHandle: 35
    ConnectToPort: 45
    ControlMemory: 1
    CreateAddressArbiter: 33
    CreateEvent: 23
    CreateMemoryBlock: 30
    CreateMutex: 19
    CreateSemaphore: 21
    CreateThread: 8
    CreateTimer: 26
    DuplicateHandle: 39
    ExitProcess: 3
    ExitThread: 9
    GetCurrentProcessorNumber: 17
    GetHandleInfo: 41
    GetProcessId: 53
    GetProcessIdOfThread: 54
    GetResourceLimit: 56
    GetResourceLimitCurrentValues: 58
    GetResourceLimitLimitValues: 57
    GetSystemInfo: 42
    GetSystemTick: 40
    GetThreadContext: 59
    GetThreadId: 55
    GetThreadIdealProcessor: 15
    GetThreadPriority: 11
    MapMemoryBlock: 31
    OutputDebugString: 61
    QueryMemory: 2
    ReleaseMutex: 20
    ReleaseSemaphore: 22
    SendSyncRequest1: 46
    SendSyncRequest2: 47
    SendSyncRequest3: 48
    SendSyncRequest4: 49
    SendSyncRequest: 50
    SetThreadPriority: 12
    SetTimer: 27
    SignalEvent: 24
    SleepThread: 10
    UnmapMemoryBlock: 32
    WaitSynchronization1: 36
    WaitSynchronizationN: 37
SystemControlInfo:
  SaveDataSize            : 0KB
  RemasterVersion         : 0
  StackSize               : 0x40000
EOF
              RSF="cia.rsf"
            fi
            makerom -f cia -o atari2600_3ds.cia -elf "$ELF" -rsf "$RSF" -icon icon.icn -banner banner.bnr || makerom -f cia -o atari2600_3ds.cia -elf "$ELF" -rsf "$RSF" -icon icon.icn
          fi
      - name: Upload CIA & 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Atari2600-3DS-Release
          path: |
            build_dir/**/*.cia
            build_dir/**/*.3dsx
