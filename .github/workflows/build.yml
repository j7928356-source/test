name: Build CIA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y unzip wget git cmake g++ make python3

      - name: Install 3DS libraries (libctru, smdhtool, 3dsxtool)
        run: |
          if [ -d /opt/devkitpro/libctru ] && [ -x /opt/devkitpro/tools/bin/smdhtool ]; then
            echo "3ds-dev already installed, skipping"
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i"
            if dkp-pacman -Syu --noconfirm 3ds-dev; then exit 0; fi
            sleep $((i * 15))
          done
          echo "Could not install 3ds-dev (pkg.devkitpro.org unreachable)"
          exit 1

      - name: Install makerom
        run: |
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O makerom.zip
          mkdir -p mr && unzip -o makerom.zip -d mr
          cp "$(find mr -type f -name 'makerom*' ! -name '*.zip' | head -n 1)" /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          makerom -version || true

      - name: Install bannertool (build from source)
        run: |
          git clone --recursive https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          mkdir build && cd build
          cmake .. && make -j"$(nproc)"
          cp "$(find . -type f -name bannertool | head -n 1)" /usr/local/bin/bannertool
          chmod +x /usr/local/bin/bannertool

      - name: Unpack project zip
        run: |
          ZIP="$(find . -maxdepth 2 -name 'atari2600_3ds_project.zip' -not -path './.git/*' | head -n 1)"
          mkdir -p build_dir
          if [ -n "$ZIP" ]; then
            echo "Found $ZIP"
            unzip -o "$ZIP" -d build_dir
          else
            echo "Zip not found, using repo files directly"
            cp -r ./* build_dir/ 2>/dev/null || true
          fi
          find build_dir -maxdepth 3 -not -path '*/.git/*'

      - name: Fix cia.rsf (invalid keys for makerom)
        run: |
          MK="$(find build_dir -name Makefile | head -n 1)"
          cd "$(dirname "$MK")"
          cat > cia.rsf << 'RSF_EOF'
          BasicInfo:
            Title                   : Atari 2600 3DS
            CompanyCode             : "00"
            ProductCode             : CTR-P-A26X
            ContentType             : Application
            Logo                    : Nintendo

          TitleInfo:
            Category                : Application
            UniqueId                : 0xFA260

          Option:
            UseOnSD                 : true
            FreeProductCode         : true
            EnableCrypt             : false
            EnableCompress          : true

          AccessControlInfo:
            CoreVersion             : 2
            DescVersion             : 2
            ReleaseKernelMajor      : "02"
            ReleaseKernelMinor      : "33"
            UseExtSaveData          : false
            FileSystemAccess:
              - DirectSdmc
            MemoryType              : Application
            SystemMode              : 64MB
            IdealProcessor          : 0
            AffinityMask            : 1
            Priority                : 16
            MaxCpu                  : 0x9E
            HandleTableSize         : 0x200
            DisableDebug            : false
            EnableForceDebug        : false
            CanWriteSharedPage      : true
            CanUsePrivilegedPriority : false
            CanUseNonAlphabetAndNumber : true
            PermitMainFunctionArgument : true
            CanShareDeviceMemory    : true
            RunnableOnSleep         : false
            SpecialMemoryArrange    : true
            ServiceAccessControl:
              - APT:U
              - ac:u
              - cfg:u
              - dsp::DSP
              - fs:USER
              - gsp::Gpu
              - hid:USER
              - ndm:u
              - ptm:u
            SystemCallAccess:
              ArbitrateAddress: 34
              Break: 60
              CancelTimer: 28
              ClearEvent: 25
              ClearTimer: 29
              CloseHandle: 35
              ConnectToPort: 45
              ControlMemory: 1
              CreateAddressArbiter: 33
              CreateEvent: 23
              CreateMemoryBlock: 30
              CreateMutex: 19
              CreateSemaphore: 21
              CreateThread: 8
              CreateTimer: 26
              DuplicateHandle: 39
              ExitProcess: 3
              ExitThread: 9
              GetCurrentProcessorNumber: 17
              GetHandleInfo: 41
              GetProcessId: 53
              GetProcessIdOfThread: 54
              GetResourceLimit: 56
              GetResourceLimitCurrentValues: 58
              GetResourceLimitLimitValues: 57
              GetSystemInfo: 42
              GetSystemTick: 40
              GetThreadContext: 59
              GetThreadId: 55
              GetThreadIdealProcessor: 15
              GetThreadPriority: 11
              MapMemoryBlock: 31
              OutputDebugString: 61
              QueryMemory: 2
              ReleaseMutex: 20
              ReleaseSemaphore: 22
              SendSyncRequest1: 46
              SendSyncRequest2: 47
              SendSyncRequest3: 48
              SendSyncRequest4: 49
              SendSyncRequest: 50
              SetThreadPriority: 12
              SetTimer: 27
              SignalEvent: 24
              SleepThread: 10
              UnmapMemoryBlock: 32
              WaitSynchronization1: 36
              WaitSynchronizationN: 37

          SystemControlInfo:
            SaveDataSize            : 0KB
            RemasterVersion         : 0
            StackSize               : 0x40000
          RSF_EOF

      - name: Build CIA
        shell: bash
        run: |
          MK="$(find build_dir -name Makefile | head -n 1)"
          [ -n "$MK" ] || { echo "ERROR: no Makefile found"; exit 1; }
          cd "$(dirname "$MK")"
          echo "DEVKITARM=$DEVKITARM"
          # regenerate placeholder assets if missing
          [ -f assets/icon.png ] || python3 tools/make_assets.py
          set +e
          make cia 2>&1 | tee ../../build.log
          STATUS=${PIPESTATUS[0]}
          echo ""
          echo "=========== ERROR SUMMARY ==========="
          grep -nE "error:|undefined reference|No such file|\*\*\*|Error [0-9]|cannot find|fatal" ../../build.log | tail -25
          echo "====================================="
          exit $STATUS

      - name: Collect output
        run: |
          mkdir -p out
          find build_dir \( -name '*.cia' -o -name '*.3dsx' \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Atari2600-CIA
          path: out/*
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
